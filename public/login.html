<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Cloudinary Drive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --bg: #0b0d12;
      --bg-card: #181c26;
      --border: #2a3142;
      --text: #f0f2f7;
      --text-muted: #9399ad;
      --accent: #5b7cfa;
      --accent-hover: #4a6ae8;
      --error: #f87171;
      --error-bg: rgba(248, 113, 113, 0.12);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(91, 124, 250, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(124, 58, 237, 0.08), transparent);
      pointer-events: none;
    }

    .login-card {
      position: relative;
      width: min(100%, 400px);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--bg-card);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .login-brand-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(91, 124, 250, 0.12);
      color: var(--accent);
    }

    .login-brand h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .login-brand p {
      margin: 4px 0 0;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .login-form {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #12151c;
      color: var(--text);
      font: inherit;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91, 124, 250, 0.2);
    }

    button {
      margin-top: 8px;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .error-message {
      display: none;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--error-bg);
      color: var(--error);
      font-size: 0.875rem;
    }

    .error-message.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <div>
        <h1>Cloudinary Drive</h1>
        <p>Enter password to continue</p>
      </div>
    </div>

    <form id="login-form" class="login-form">
      <p id="error-message" class="error-message" role="alert"></p>
      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        autofocus
      >
      <button type="submit" id="submit-btn">Sign in</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const errorMessage = document.getElementById('error-message');

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('visible');
    }

    function clearError() {
      errorMessage.textContent = '';
      errorMessage.classList.remove('visible');
    }

    async function checkExistingSession() {
      try {
        const response = await fetch('/api/auth/status', { credentials: 'same-origin' });
        const data = await response.json();
        if (data.authenticated) {
          window.location.replace('/');
        }
      } catch {
        // Ignore — user can still sign in manually.
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearError();

      const password = passwordInput.value;
      if (!password) {
        showError('Please enter your password.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ password }),
        });

        const data = await response.json();

        if (!response.ok) {
          showError(data.error || 'Invalid password');
          passwordInput.focus();
          passwordInput.select();
          return;
        }

        window.location.replace('/');
      } catch {
        showError('Could not connect to server. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });

    checkExistingSession();
  </script>
</body>
</html>
